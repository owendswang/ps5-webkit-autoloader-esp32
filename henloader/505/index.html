<!DOCTYPE html>

<head>

    <title>PlayStation Pulse PS4 5.05 FW GoldHEN Host</title>
<style>
        :root {
            --bg: #050706;
            --panel: #080c0a;
            --raised: #0d1510;
            --line: #34443a;
            --line-bright: #607b68;
            --text: #f1f6f2;
            --muted: #b4c1b8;
            --dim: #86958b;
            --green: #73f5a6;
            --green-soft: #36bd77;
            --amber: #dfbd73;
            --red: #ff9b9b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg);
            background-image: linear-gradient(rgba(115, 245, 166, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(115, 245, 166, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 16px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex: 1 0 auto;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
            padding: 24px 0 20px;
            width: min(100% - 64px, 1120px);
        }

        .header-section,
        .status-container,
        .controls-section {
            background: rgba(8, 12, 10, 0.92);
            border: 1px solid var(--line);
        }

        .header-section {
            margin-bottom: 12px;
            padding: 20px 28px 22px;
            position: relative;
        }

        .header-section::before {
            color: var(--green);
            content: "●  PS4 / OFFLINE 5.05 HOST";
            display: block;
            font-size: 13px;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }

        .header-section::after {
            color: var(--dim);
            content: "SYS / READY   //   AUTO JAILBREAK";
            font-size: 12px;
            letter-spacing: 0.08em;
            position: absolute;
            right: 28px;
            top: 21px;
        }

        .main-title {
            color: var(--text);
            font-size: clamp(30px, 5vw, 50px);
            font-weight: 400;
            letter-spacing: -0.07em;
            line-height: 1.05;
        }

        .main-title::before { color: var(--green); content: "> "; }
        .subtitle { color: var(--green); font-size: 16px; margin-top: 12px; }
        .version-info { color: var(--muted); font-size: 14px; margin-top: 7px; }
        .fw-display { border-left: 2px solid var(--green); color: var(--text); display: inline-block; font-size: 14px; margin-top: 12px; padding: 5px 10px; }
        .status-container { color: var(--muted); padding: 14px 18px; }
        .notification, .notification2 { background: var(--panel); border: 1px solid var(--line-bright); color: var(--text); min-height: 42px; padding: 10px 14px; }
        #log { color: var(--text); font-size: 15px; line-height: 1.45; }
        #log h1 { color: var(--text) !important; font-size: 15px; font-weight: 400; line-height: 1.45; margin: 0; }
        #console { display: none !important; }
        .jailbreak-status { border-left: 2px solid var(--green); color: var(--green); font-size: 16px; margin-top: 10px; padding: 4px 10px; }
        .jailbreak-status + div { color: var(--muted) !important; font-size: 13px !important; margin-top: 8px !important; }
        #passCounter { color: var(--green) !important; }
        #failCounter { color: var(--red) !important; }

        .chain-selector {
            align-items: center;
            border-top: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-top: 12px;
            padding-top: 12px;
        }

        .chain-label { color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
        .chain-options { display: flex; gap: 8px; }
        .chain-option,
        .buttons-grid button {
            background: var(--panel);
            border: 1px solid var(--line-bright);
            border-radius: 0;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            min-height: 42px;
            padding: 8px 12px;
            transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .chain-option:hover,
        .chain-option:focus,
        .chain-option[aria-pressed="true"],
        .buttons-grid button:hover,
        .buttons-grid button:focus {
            background: var(--raised);
            border-color: var(--green);
            color: var(--green);
            outline: none;
        }

        .chain-note { color: var(--dim); font-size: 12px; }
        .controls-section { margin-top: 12px; padding: 16px 18px; }
        .section-title { border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; letter-spacing: 0.12em; margin-bottom: 12px; padding-bottom: 9px; text-transform: uppercase; }
        .buttons-grid { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .buttons-grid button { min-height: 44px; text-align: left; }

        .credits {
            border-top: 1px solid var(--line);
            color: var(--muted);
            flex: 0 0 auto;
            font-size: 13px;
            margin: 0 auto;
            padding: 8px 20px 10px;
            text-align: center;
            width: min(100% - 64px, 1120px);
        }

        .credits-line { display: inline; }
        .credits-line + .credits-line::before { color: var(--line-bright); content: "  //  "; }
        .credit-label { color: var(--muted); }
        .credits a { color: var(--text); }
        .credits a:hover, .credits a:focus { color: var(--green); }

        @media (max-width: 820px) {
            body { overflow: auto; }
            .container { justify-content: flex-start; padding: 24px 0 20px; width: min(100% - 32px, 560px); }
            .header-section { padding: 20px 18px 22px; }
            .header-section::after { display: none; }
            .main-title { font-size: clamp(30px, 9vw, 44px); }
            .chain-selector { align-items: flex-start; flex-direction: column; }
            .chain-options { width: 100%; }
            .chain-option { flex: 1; }
            .buttons-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .credits-line { display: block; margin: 4px 0; }
            .credits-line + .credits-line::before { content: ""; }
        }

        @media (max-width: 430px) {
            .buttons-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 30px; }
        }

        #progress { margin: 0; padding: 0; }
        #msgs2 { border-left: 2px solid var(--green); color: var(--green); font-size: 16px; font-weight: 400; line-height: 1.45; min-height: 24px; padding: 4px 10px; text-align: left; }
        #msgs2 h1, #msgs h1 { color: var(--text) !important; font-size: 15px; font-weight: 400; line-height: 1.45; margin: 0; }
        #msgs { color: var(--muted); font-size: 15px; line-height: 1.45; }
        #menu { display: none; }
        .buttons-grid-goldhen { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 12px; }
        .buttons-grid-goldhen button { background: var(--panel); border: 1px solid var(--line-bright); border-radius: 0; color: var(--text); cursor: pointer; font: inherit; min-height: 44px; padding: 8px 12px; text-align: left; transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
        .buttons-grid-goldhen button:hover, .buttons-grid-goldhen button:focus { background: var(--raised); border-color: var(--green); color: var(--green); outline: none; }
        @media (max-width: 430px) { .buttons-grid-goldhen { grid-template-columns: 1fr; } }
    </style>
