<script>
(function () {

  var status = document.getElementById('status');
  var cache = window.applicationCache;
  var installing = false;
  var failed = false;
  var downloading = false;
  var version = '0.6.1';
  var progress = document.getElementById('progress');
  var percent = document.getElementById('percent');
  var choice = document.getElementById('choice');
  var cacheReady = false;
  var detail = document.getElementById('detail');
  var progressBar = document.getElementById('progressBar');
  var logContainer = document.getElementById('logContainer');

  var isCachePage = cacheMode !== null;
  var navigating = false;
  var countdown = null;

  function setProgress(value) {

    progressBar.style.webkitTransform = 'scaleX(' + value / 100 + ')';
    progressBar.style.transform = 'scaleX(' + value / 100 + ')';

  function appendLog(message) {
    logContainer.hidden = false;
    logContainer.textContent += message;
    logContainer.scrollTop = logContainer.scrollHeight;

  // Two keys, on this origin, which the homescreen app shares:
  //   wkal_exploit  the chain of the last install that actually completed. The
  //                 pointer reads this, so a new choice never clears it.
  //   wkal_pending  the next chain, committed only after the cache is ready.
  // Each chain has its own cache page and manifest.
  function readKey(key) {
    try { return window.localStorage.getItem(key); } catch (error) { return null; }
  }
  function writeKey(key, value) {
    try {

      else window.localStorage.setItem(key, value);
    } catch (error) { }

  var installed = readKey('wkal_exploit');

  var picked = cacheMode;
  if (!valid(picked)) picked = null;

  var match = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
  var fw = match ? parseFloat(match[1]) : 0;

  var hasRelapse = fw >= 7 && fw <= 13.60 && fw !== 9.05 && fw !== 11.40;

  // Ignore stored choices that this known firmware cannot run.

    if (picked === 'poops' && !hasPoops) picked = null;

  var defaultChoice = single || installed || (hasPoops && hasRelapse ? 'poops' : 'relapse');

  function showChoice(message) {
    status.textContent = 'Select Exploit';
    detail.textContent = (match ? 'Firmware ' + match[1] : 'Your firmware') +
      ' supports both Poops and Relapse.\n' + message;
    choice.hidden = false;
    document.getElementById(defaultChoice).className += ' selected';
  }

  function choose(chain) {
    if (navigating) return;
    navigating = true;
    if (countdown !== null) clearInterval(countdown);
    document.getElementById('poops').disabled = true;
    document.getElementById('relapse').disabled = true;
    // Keep the previous installed choice until the offline cache is verified.
    writeKey('wkal_pending', chain);
    picked = chain;
    status.textContent = 'Selected ' + (chain === 'poops' ? 'Poops' : 'Relapse') + '...';
    detail.textContent = 'Preparing cache download...';
    location.replace(cachePages[chain]);

  document.getElementById('poops').onclick = function () { choose('poops'); };
  document.getElementById('relapse').onclick = function () { choose('relapse'); };

  function fail(message) {
    failed = true;
    status.textContent = message;
    status.className = 'error';
    detail.textContent = 'Connect to the ESP32 and reload this page to retry.';
    progress.className = 'error';
    logContainer.className = 'error';

    if (failed || cacheReady) return;
    cacheReady = true;
    setProgress(100);

  // Only successful cache completion/check events may proceed.
  function maybeInstall() {
    if (!cacheReady || failed || installing) return;
    if (!picked) return;

    detail.textContent = 'The offline cache is ready. Keep this page open.';

        progress.className = 'success';
        detail.textContent = 'Loading selected exploit...';
        location.replace('/app/index.html?force=' + picked);

      .catch(function (error) { fail(error.message); });

    status.className = 'error';
    detail.textContent = 'Supported: 7.00–12.00 via Poops, 7.00–13.60 via Relapse (except 9.05 and 11.40).';

    return;

        ? 'Choose an exploit, or wait to use the current selection.'
        : 'Choose an exploit, or wait to use the default.');
      setProgress(100);
      document.getElementById(defaultChoice).focus();
      var deadline = Date.now() + 5000;
      function tick() {
        var seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));

        if (!seconds) choose(defaultChoice);

      tick();

    status.textContent = 'This browser does not support offline AppCache.';
    detail.textContent = '';
    progress.hidden = true;
    return;

  cache.addEventListener('checking', function () {
    appendLog('[AppCache] Checking for updates...\n');
  });
  cache.addEventListener('downloading', function () {
    downloading = true;
    appendLog('[AppCache] Downloading offline content...\n');
  });
  cache.addEventListener('progress', function (event) {
    if (failed || cacheReady) return;
    if (event.total > 0) {
      var value = Math.min(99, Math.round(event.loaded * 100 / event.total));
      setProgress(value);
    } else {
      progress.removeAttribute('aria-valuenow');
      progress.className = 'indeterminate';
      progressBar.style.webkitTransform = 'scaleX(1)';
      progressBar.style.transform = 'scaleX(1)';
      percent.textContent = 'Downloading...';
    }
  });
  cache.addEventListener('cached', function () { downloading = false; install(); });
  cache.addEventListener('noupdate', function () { downloading = false; install(); });
  cache.addEventListener('updateready', function () {
    // Once the cache is ready or the install has started, a late event is just
    // in-flight noise and must not overwrite the success message.
    if (installing || failed || cacheReady) return;
    downloading = false;
    // This cached page embeds its version. Reload after swapping so the
    // marker check and pointer use the new version, without asking again.
    if (cache.status === cache.UPDATEREADY) {
      try {
        cache.swapCache();
        location.reload();
      } catch (error) {
        fail('Could not activate the updated cache. Reload this page to retry.');

      return;
    }
    install();
  });
  cache.addEventListener('error', function () {
    if (failed || cacheReady || installing) return;
    if (downloading) fail('Cache download failed. Run the installer again.');
    else fail('The offline cache could not be checked. Run the installer again.');
  });
  cache.addEventListener('obsolete', function () {
    if (failed || cacheReady || installing) return;
    fail('The cached manifest was superseded. Re-run the installer to finish.');
  });
  setTimeout(function () {
    if (!cacheReady && !failed) {
      status.textContent = 'Caching is taking unusually long';
      detail.textContent = 'Keep this page open or run the installer again.';
    }

})();
